[project]
name = "docstring-drift"
version = "0.1.0"
description = "Find docstrings that document parameters their function does not have. Pure AST, no imports, no execution."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.40", "altair>=5", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
